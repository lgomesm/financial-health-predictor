[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-health-predictor"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.4,<2.0",
    "matplotlib>=3.8,<4.0",
    "numpy>=1.26,<2.0",
    "pandas>=2.2,<3.0",
    "plotly>=5.22,<7.0",
    "scikit-learn>=1.5,<2.0",
    "streamlit>=1.36,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
mypy_path = ["src"]
explicit_package_bases = true
strict = true
warn_unreachable = true
